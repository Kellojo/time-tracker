  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="8"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2fb267" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="68 100" transform="rotate(-90 32 32)"/>
  <path d="M32 23v10l6 4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
